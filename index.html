<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài thuyết trình</title>
    <style>
        body { 
            margin: 0; 
            padding: 0;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #000000; 
        }
        .slide-container {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="slide-container">
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vRmE70_Ggn1kK4HXcyI1Nv00cktXK96xDNA1xBUPcqvj8myJgWQZtIRvzBh3GWxQg/embed?start=false&loop=false&delayms=3000" 
                allowfullscreen="true" 
                mozallowfullscreen="true" 
                webkitallowfullscreen="true">
        </iframe>
    </div>

</body>
</html>
